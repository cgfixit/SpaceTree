name: cargo-deny

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cargo-deny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install cargo-deny
        run: |
          set -eu
          version=0.20.2
          file="cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/${file}"
          curl -fsSL -o "$file" "$url"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  ${file}" | sha256sum -c
          tar -xzf "$file"
          install -m 0755 "cargo-deny-${version}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/cargo-deny"

      - name: Check advisories, licenses, bans, and sources
        run: |
          "$HOME/cargo-deny" check
