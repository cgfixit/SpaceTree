name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 2026-09-12
        with:
          toolchain: stable

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev

      - name: Test
        run: cargo test --locked --all-targets

      - name: Boot the scanner
        run: ./scripts/ci-runtime.sh target/debug/spacetree

      - name: Check sizes against stat, du, and df
        if: runner.os == 'macOS'
        run: ./scripts/verify-macos-sizes.sh target/debug/spacetree

      - name: Probe APFS clone attributes (temporary)
        if: runner.os == 'macOS'
        run: python3 scripts/probe-apfs-clones.py
