name: bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: SpaceTree.app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 2026-09-12
        with:
          toolchain: stable

      - name: Cache cargo registry and release target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-bundle-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bundle-

      - name: Bundle
        env:
          CARGO_TARGET_DIR: target/bundle
        run: sh scripts/make-app.sh

      - name: Verify the bundle
        run: |
          set -euo pipefail
          app="dist/SpaceTree.app"
          bin="$app/Contents/MacOS/spacetree"
          test -x "$bin"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "com.cgfixit.spacetree"
          codesign --verify --verbose=2 "$app"
          lipo -info "$bin" | grep -q "$(uname -m)"

      - name: Zip the app
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=x86_64 ;;
            *) echo "unexpected arch $(uname -m)" >&2; exit 1 ;;
          esac
          ditto -c -k --keepParent dist/SpaceTree.app "dist/SpaceTree-macos-${arch}.zip"
          rm -rf "${RUNNER_TEMP}/unzip"
          mkdir -p "${RUNNER_TEMP}/unzip"
          ditto -x -k "dist/SpaceTree-macos-${arch}.zip" "${RUNNER_TEMP}/unzip"
          codesign --verify --verbose=2 "${RUNNER_TEMP}/unzip/SpaceTree.app"

      - name: Upload app zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacetree-app
          path: dist/SpaceTree-macos-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
