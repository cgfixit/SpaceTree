<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SpaceTree app icon. Apple macOS grid: 824 px body centered on a 1024 canvas. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2156"/>
      <stop offset="0.55" stop-color="#0d1030"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0.28" cy="0.22" r="0.5">
      <stop offset="0" stop-color="#7b4dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.82" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#1fc8d8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1fc8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.38" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#4fe0c8"/>
      <stop offset="0.45" stop-color="#1f8f9f"/>
      <stop offset="1" stop-color="#14204f"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#7fffe8" stop-opacity="0.0"/>
      <stop offset="0.9" stop-color="#7fffe8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fffe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2216"/>
      <stop offset="0.45" stop-color="#8a5a3a"/>
      <stop offset="1" stop-color="#2c1910"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <clipPath id="crown">
      <circle cx="380" cy="300" r="128"/>
      <circle cx="515" cy="252" r="132"/>
      <circle cx="650" cy="302" r="124"/>
      <circle cx="336" cy="440" r="100"/>
      <circle cx="694" cy="440" r="96"/>
      <circle cx="515" cy="410" r="172"/>
      <circle cx="430" cy="500" r="92"/>
      <circle cx="600" cy="500" r="92"/>
    </clipPath>
    <clipPath id="front" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="400" width="1024" height="624"/>
    </clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sky)"/>
  </g>

  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#nebulaA)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#nebulaB)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="186" cy="196" r="3.2" opacity="0.9"/>
      <circle cx="252" cy="148" r="2" opacity="0.6"/>
      <circle cx="348" cy="176" r="2.4" opacity="0.75"/>
      <circle cx="430" cy="132" r="1.8" opacity="0.5"/>
      <circle cx="604" cy="150" r="2.6" opacity="0.8"/>
      <circle cx="700" cy="128" r="1.8" opacity="0.55"/>
      <circle cx="812" cy="182" r="3" opacity="0.85"/>
      <circle cx="866" cy="262" r="2" opacity="0.6"/>
      <circle cx="152" cy="300" r="2" opacity="0.55"/>
      <circle cx="214" cy="402" r="2.8" opacity="0.8"/>
      <circle cx="146" cy="508" r="1.8" opacity="0.5"/>
      <circle cx="226" cy="590" r="2.2" opacity="0.65"/>
      <circle cx="842" cy="404" r="2.4" opacity="0.7"/>
      <circle cx="890" cy="512" r="1.8" opacity="0.5"/>
      <circle cx="800" cy="610" r="2.6" opacity="0.75"/>
      <circle cx="170" cy="682" r="2" opacity="0.55"/>
      <circle cx="868" cy="694" r="2" opacity="0.5"/>
      <circle cx="520" cy="118" r="1.6" opacity="0.5"/>
    </g>
    <g fill="#ffffff">
      <path d="M776 238 l6 -18 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 z" opacity="0.95"/>
      <path d="M250 262 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 z" opacity="0.8"/>
    </g>

    <!-- orbit, back half -->
    <ellipse cx="512" cy="400" rx="350" ry="104" fill="none" stroke="#8fe9ff" stroke-opacity="0.35"
             stroke-width="5" transform="rotate(-14 512 400)"/>

    <!-- planet -->
    <circle cx="512" cy="1150" r="440" fill="url(#glow)" filter="url(#soft)"/>
    <circle cx="512" cy="1150" r="420" fill="url(#planet)"/>
    <path d="M140 870 q120 -40 240 -18" stroke="#0e3a52" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M640 842 q100 -18 220 16" stroke="#0e3a52" stroke-width="12" fill="none" opacity="0.45" stroke-linecap="round"/>
    <circle cx="420" cy="812" r="10" fill="#0e3a52" opacity="0.45"/>
    <circle cx="690" cy="884" r="14" fill="#0e3a52" opacity="0.4"/>

    <!-- trunk and branches -->
    <path d="M488 760 C493 680 496 620 499 560 L525 560 C528 620 531 680 538 760 Z" fill="url(#bark)"/>
    <path d="M470 772 q42 -24 86 0 q-10 -18 -43 -22 q-33 4 -43 22 z" fill="#2c1910"/>
    <g stroke="#8a5a3a" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M508 610 C474 596 446 586 420 572"/>
      <path d="M516 604 C552 592 582 584 608 572"/>
    </g>

    <!-- canopy: a squarified treemap in SpaceTree's extension colors, cut to a crown -->
    <g clip-path="url(#crown)">
      <rect x="200" y="110" width="624" height="500" fill="#0b0d18"/>
      <rect x="232" y="118" width="268" height="277" rx="18" fill="#dc3c3c"/>
      <rect x="232" y="403" width="138" height="191" rx="14" fill="#28b4a0"/>
      <rect x="378" y="403" width="122" height="191" rx="14" fill="#f0a030"/>
      <rect x="508" y="118" width="284" height="212" rx="18" fill="#4669e6"/>
      <rect x="508" y="338" width="140" height="256" rx="16" fill="#b4c828"/>
      <rect x="656" y="338" width="136" height="110" rx="14" fill="#9a3cc0"/>
      <rect x="656" y="456" width="58" height="138" rx="10" fill="#e678b4"/>
      <rect x="722" y="456" width="70" height="54" rx="10" fill="#46c8e6"/>
      <rect x="722" y="518" width="70" height="76" rx="10" fill="#e6d246"/>
      <g fill="url(#shine)">
        <rect x="232" y="118" width="268" height="277" rx="18"/>
        <rect x="232" y="403" width="138" height="191" rx="14"/>
        <rect x="378" y="403" width="122" height="191" rx="14"/>
        <rect x="508" y="118" width="284" height="212" rx="18"/>
        <rect x="508" y="338" width="140" height="256" rx="16"/>
        <rect x="656" y="338" width="136" height="110" rx="14"/>
        <rect x="656" y="456" width="58" height="138" rx="10"/>
        <rect x="722" y="456" width="70" height="54" rx="10"/>
        <rect x="722" y="518" width="70" height="76" rx="10"/>
      </g>
    </g>

    <!-- orbit, front half over the crown, and its moon -->
    <g transform="rotate(-14 512 400)">
      <ellipse cx="512" cy="400" rx="350" ry="104" fill="none" stroke="#8fe9ff" stroke-opacity="0.85"
               stroke-width="6" clip-path="url(#front)"/>
      <circle cx="841" cy="436" r="23" fill="#f4f1ff"/>
      <circle cx="835" cy="430" r="23" fill="#c9c2ff" opacity="0.35"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
